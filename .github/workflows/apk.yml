name: APK барои коргарон
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AutoPeshsaf.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AUTO PESHSAF — барномаи Android
          body: Барномаи коргарон. Файли AutoPeshsaf.apk-ро боргирӣ ва насб кунед.
          files: AutoPeshsaf.apk
          make_latest: true
