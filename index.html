<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1016">
<title>AUTO PESHSAF Дархостҳо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: compact sticky app bar, KPI row, horizontally scrolling status pipeline, card list; detail opens as a side panel (desktop) or bottom sheet (phone). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef2f6; --ink:#0f1722; --muted:#637080; --line:#e1e6ec;
  --primary:#2457d6; --primary-ink:#ffffff; --primary-soft:#e5ecfb; --tag:#f0b21c; --tag-ink:#2a1f00;
  --ok:#17824d; --ok-bg:#ddf3e6; --warn:#a25f00; --warn-bg:#fdf0d5; --info:#1f56a8; --info-bg:#e0eafa;
  --bad:#b02a2a; --bad-bg:#fbe3e3; --neutral:#7a8796; --neutral-bg:#e8ecf1; --violet:#6142b8; --violet-bg:#ece6fb;
  --shadow:0 1px 2px rgba(15,23,34,.05),0 4px 14px rgba(15,23,34,.04); --scrim:rgba(8,12,18,.5);
  --display:"Rubik",system-ui,sans-serif; --body:"Noto Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --surface:#141a22; --surface2:#1b222c; --ink:#e7ecf2; --muted:#8c98a7; --line:#232c37;
  --primary:#6f9cff; --primary-ink:#0a1120; --primary-soft:#18243c; --tag:#e9ad1a; --tag-ink:#241a00;
  --ok:#62d096; --ok-bg:#12301f; --warn:#f3be63; --warn-bg:#35270c; --info:#86b4f5; --info-bg:#15263d;
  --bad:#f19494; --bad-bg:#3a1919; --neutral:#8c98a7; --neutral-bg:#222a35; --violet:#b8a2f2; --violet-bg:#271f3e;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --surface:#141a22; --surface2:#1b222c; --ink:#e7ecf2; --muted:#8c98a7; --line:#232c37;
  --primary:#6f9cff; --primary-ink:#0a1120; --primary-soft:#18243c; --tag:#e9ad1a; --tag-ink:#241a00;
  --ok:#62d096; --ok-bg:#12301f; --warn:#f3be63; --warn-bg:#35270c; --info:#86b4f5; --info-bg:#15263d;
  --bad:#f19494; --bad-bg:#3a1919; --neutral:#8c98a7; --neutral-bg:#222a35; --violet:#b8a2f2; --violet-bg:#271f3e;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
/* app bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font:700 13px var(--mono);flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font:700 15px var(--display);letter-spacing:.03em}
.brand span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;color:var(--muted);font:600 12.5px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{padding-block:16px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:21px;font-weight:600} h2{font-size:16px;font-weight:600}
h3{font:600 11.5px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.muted{color:var(--muted)} .small{font-size:13px} .spacer{flex:1}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:14px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--primary)}
.badge{background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.kpi b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b small{font:600 12px var(--body);color:var(--muted);margin-left:3px}
.kpi.pos b{color:var(--ok)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* pipeline */
.pipe-wrap{overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.pipe-wrap::-webkit-scrollbar{display:none}
.pipe{display:flex;gap:8px;width:max-content}
.st{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 10px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--neutral))}
.st b{font-variant-numeric:tabular-nums;font-weight:700;background:var(--surface2);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.st.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.on b{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.alert{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;border:0;text-align:left;cursor:pointer;width:100%}
.alert .arr{margin-left:auto}
/* toolbar */
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search svg{position:absolute;left:11px;top:50%;margin-top:-8px;color:var(--muted)}
.search input{padding-left:36px;background:var(--surface);height:40px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;height:40px;font:500 13px var(--body);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:transparent;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 14px;height:40px;font:600 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.ok{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn:disabled{opacity:.5;cursor:default}
.btn,.chip,.st,.rq,.seg button,.tabs button{transition:background .15s,border-color .15s,color .15s}
:is(button,a,input,select,textarea):focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.desk{display:inline-flex} @media (max-width:640px){.desk{display:none}}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:8;width:56px;height:56px;border-radius:16px;border:0;background:var(--primary);color:var(--primary-ink);font-size:28px;box-shadow:0 8px 24px rgba(36,87,214,.35);cursor:pointer;display:none}
@media (max-width:640px){.fab{display:grid;place-items:center}}
/* request cards */
.rqs{display:flex;flex-direction:column;gap:8px}
.rq{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);width:100%;overflow:hidden}
.rq::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--neutral))}
.rq:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}
.rq .l1{display:flex;align-items:center;gap:8px;min-width:0}
.rq .t1{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1}
.rq .t2{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;min-width:0;grid-column:1/-1}
.rq .t2 span{white-space:nowrap}
.rq .r1{justify-self:end;display:flex;align-items:center;gap:8px}
.tag{font:700 11.5px var(--mono);background:var(--tag);color:var(--tag-ink);padding:2px 7px 2px 14px;border-radius:3px 6px 6px 3px;position:relative;white-space:nowrap;letter-spacing:.02em}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--surface)}
.time{font-size:12px;color:var(--muted);white-space:nowrap}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.k-n{--c:var(--info)} .k-a{--c:var(--neutral)} .k-s{--c:var(--warn)} .k-f{--c:var(--warn)} .k-o{--c:var(--violet)} .k-d{--c:var(--ok)} .k-g{--c:var(--ok)} .k-x{--c:var(--bad)}
.price{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-weight:600}
/* forms & cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:72px;resize:vertical}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);cursor:pointer;background:var(--surface2);font-weight:500}
.radio label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.radio input{width:auto;accent-color:var(--primary)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding-block:4px 8px;z-index:1}
.sheet-h .ttl{flex-basis:100%;order:3;font:600 18px var(--display)}
.x{margin-left:auto;border:0;background:var(--surface2);width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer;line-height:1}
@media (max-width:640px){.sheet-bg{align-items:flex-end}.sheet{height:94%;border-radius:18px 18px 0 0;padding-top:8px}.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}.kv{grid-template-columns:100px 1fr}}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;font-size:13px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0 6px 14px;border-left:2px solid var(--line);position:relative}
.log li::before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.log time{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:12px}
.wa{font-family:var(--mono);font-size:13px;background:var(--surface2);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.margin{display:flex;gap:16px;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px}
.margin b{display:block;font:700 15px var(--mono)}
/* customer */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--neutral-bg)}
.steps i.on{background:var(--ok)}
.steps-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);gap:4px}
.steps-l span.on{color:var(--ink);font-weight:600}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ccard .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.offer{background:var(--violet-bg);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.offer .price{font-size:20px;color:var(--violet)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
/* users */
.ulist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.urow{display:grid;grid-template-columns:auto 1fr minmax(150px,200px);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:14px}
.urow .main{min-width:0}
.crew{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px 8px 8px;text-align:left;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.crew b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.crew .av{flex:none}
.crew.on{border-color:var(--primary);background:var(--primary-soft)}
.crew.on .av{background:var(--primary);color:var(--primary-ink)}
.crew.warn .av{background:var(--warn-bg);color:var(--warn)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick .crew{width:100%;box-shadow:none}
.link{border:0;background:none;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.who{font-weight:600;color:var(--ink)} .who.none{color:var(--warn)}
.login{max-width:420px;width:100%;margin:12px auto 0;display:flex;flex-direction:column;gap:14px}
.lhead{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-block:8px}
.lhead .logo{width:52px;height:52px;border-radius:14px;font-size:17px}
.login .seg{align-self:stretch!important}.login .seg button{flex:1;padding:9px 10px}
.pw{position:relative}.pw input{padding-right:96px}.pw .link{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600}
.cred{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:4px;flex-wrap:wrap}
.ok-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.cform{margin-top:8px;display:flex;flex-direction:column;gap:8px;background:var(--surface2);border-radius:10px;padding:10px}
.cform input{background:var(--surface)}
.wgrid-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);text-align:left;width:100%}
button.wstat{cursor:pointer} button.wstat:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}
.wh{display:flex;align-items:center;gap:10px}
.wh b{display:block;font:600 16px var(--display)} .wh small{display:block;font-size:12px;color:var(--muted)}
.rate{margin-left:auto;text-align:right;font:700 22px var(--display);color:var(--ok);font-variant-numeric:tabular-nums}
.rate small{display:block;font:500 11px var(--body);color:var(--muted)}
.wnums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wnums div{background:var(--surface2);border-radius:10px;padding:8px;min-width:0}
.wnums b{display:block;font:600 18px var(--display);font-variant-numeric:tabular-nums}
.wnums span{display:block;font-size:11px;color:var(--muted);line-height:1.25}
.wnums .f b{color:var(--ok)} .wnums .o b{color:var(--warn)} .wnums .x b{color:var(--bad)}
.wbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--neutral-bg)}
.wbar i{display:block;height:100%}
.wmoney{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.wmoney b{display:block;font:700 16px var(--mono);color:var(--ink)} .wmoney .p b{color:var(--ok)}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tag);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px}
@media (max-width:520px){.urow{grid-template-columns:auto 1fr}.urow select{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .2s ease-out}@keyframes in{from{transform:translateY(16px);opacity:.6}}}
/* v8 additions: deadlines, photos, quotes, items, payments */
.due{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--warn)} .due.late{color:var(--bad)}
.urg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.urg.h24{background:var(--bad-bg);color:var(--bad)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface2);cursor:zoom-in;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb i{position:absolute;left:4px;bottom:4px;font:700 10px var(--body);font-style:normal;background:var(--scrim);color:#fff;border-radius:4px;padding:0 4px}
.upl{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:0 12px;height:40px;font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;background:var(--surface)}
.upl input{display:none}
.lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.q.chosen{border-color:var(--ok);background:var(--ok-bg)}
.q .qs{font-weight:600;min-width:0;overflow-wrap:anywhere}
.q .qc{font:700 15px var(--mono);text-align:right;white-space:nowrap}
.q .qm{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.q .qa{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.best{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:6px;padding:1px 6px}
.items{display:flex;flex-direction:column;gap:6px}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px}
.it:last-child{border-bottom:0;padding-bottom:0}
.it.off{opacity:.5;text-decoration:line-through}
.it .nm{min-width:0;overflow-wrap:anywhere}
.it input{width:110px;flex:none}
.irow{display:grid;grid-template-columns:1fr 80px;gap:8px}
.sum{display:flex;justify-content:space-between;font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.manual-f{display:none}
form:has(#n-man:checked) .manual-f{display:grid}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:14px!important}
.chk input{width:auto;accent-color:var(--primary)}
.pay{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.bal{display:flex;gap:16px;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.bal b{display:block;font:700 15px var(--mono);color:var(--ink)} .bal .due-b b{color:var(--bad)} .bal .ok-b b{color:var(--ok)}
.dgroup{display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dhead b.price{color:var(--bad);margin-left:auto}
.ccard .items{background:var(--surface2);border-radius:10px;padding:10px}
.warn-note{font-size:12.5px;color:var(--warn);font-weight:600}
button.kpi{text-align:left;cursor:pointer;width:100%;font:inherit;color:var(--ink);position:relative}
button.kpi:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.kpi.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.kpi .go{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--primary);margin-top:2px}
.alert.bad-a{background:var(--bad-bg);color:var(--bad)}
.pricing{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));box-shadow:0 0 0 3px var(--primary-soft)}
.fun{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr auto 40px;gap:10px;align-items:center;font-size:13.5px}
.frow b{font:700 16px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.frow small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.fbar{height:10px;border-radius:5px;background:var(--neutral-bg);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:5px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px dashed var(--line);white-space:nowrap}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right}
@media (max-width:520px){.frow{grid-template-columns:1fr auto 36px}.frow .fbar{grid-column:1/-1;grid-row:2}}

:root{color-scheme:light}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.login .card .btn.pri{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== settings ===== */
const firebaseConfig={apiKey:"AIzaSyCCdRRGhApVy5xESVmCrVYUJdNo1cszPCc",authDomain:"auto-peshsaf.firebaseapp.com",projectId:"auto-peshsaf",storageBucket:"auto-peshsaf.firebasestorage.app",messagingSenderId:"923283036748",appId:"1:923283036748:web:869dabd7e3913cf974b2e9"};
const ADMIN_EMAILS=["umar.safaroov@gmail.com"];           // роҳбарон (почтаи Google)
const WORKER_DOMAIN="workers.auto-peshsaf.app";            // почтаи сохтагӣ барои логини коргар

const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);
let secAuth=null; // барои сохтани ҳисоби коргар бе баромадани роҳбар
const secondaryAuth=()=>secAuth||(secAuth=getAuth(initializeApp(firebaseConfig,'secondary')));

/* ===== constants ===== */
const ST={new:{l:'Нав',k:'n'},assigned:{l:'Супорида шуд',k:'a'},searching:{l:'Дар ҷустуҷӯ',k:'s'},found:{l:'Нарх лозим',k:'f'},offered:{l:'Нарх фиристода шуд',k:'o'},ordered:{l:'Заказ шуд',k:'d'},shipped:{l:'Дар роҳ',k:'d'},delivered:{l:'Дода шуд',k:'g'},returned:{l:'Баргашт',k:'x'},notfound:{l:'Ёфт нашуд',k:'x'},cancelled:{l:'Бекор шуд',k:'x'}};
const ORDER=['new','assigned','searching','found','offered','ordered','shipped','delivered','returned','notfound','cancelled'];
const ACTIVE=['new','assigned','searching','found','offered','ordered','shipped'];
const SOLD=['ordered','shipped','delivered'];
const PRE=['new','assigned','searching'];
const URG={h24:{l:'24 соат',h:24},d3:{l:'3 рӯз',h:72},w1:{l:'1 ҳафта',h:168}};
const KIND={orig:'Оригинал',copy:'Копия',used:'Кӯҳна (б/у)'};
const COND={new:'Нав',used:'Кӯҳна',any:'Фарқ надорад'};
const GRP={new:'Запчастҳои нав',used:'Запчастҳои кӯҳна'};
const GRPS={new:'Нав',used:'Кӯҳна',all:'Ҳарду гурӯҳ'};
const CSTEPS=['Қабул','Ҷустуҷӯ','Ёфт шуд','Заказ','Дар роҳ','Дода шуд'];
const CSTAGE={new:0,assigned:0,searching:1,found:1,offered:2,ordered:3,shipped:4,delivered:5};
const PRIV_KEYS=['quotes','chosenQ','cost','supplier','supplierPhone','workerNote'];
const ICON_SEARCH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const ICON_CAM='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

const S={authReady:false,ready:false,isAdmin:false,wid:null,cid:null,denied:null,
  rawReqs:{},extra:{},privs:{},workers:{},customers:{},users:{},reqs:[],
  view:null,adminTab:'req',repTab:'o',period:'month',fStatus:'active',fGroup:'all',fWorker:'all',wTab:'new',q:'',open:null,newReq:false,toast:null,busy:false,
  nItems:1,lb:null,lastRate:2.6,entryTab:'customer',ph:{},phLoading:{}};
const app=document.getElementById('app');
let unsubs=[];

/* ===== helpers ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{if(!t)return'';const d=new Date(t);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const fdate=t=>{const d=new Date(t);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()};
const ago=t=>{if(!t)return'';const m=Math.floor((Date.now()-t)/60000);if(m<1)return'ҳозир';if(m<60)return m+' дақ. пеш';const h=Math.floor(m/60);if(h<24)return h+' соат пеш';const d=Math.floor(h/24);return d<7?d+' рӯз пеш':fmt(t).slice(0,5)};
const num=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const money=n=>(n||n===0)&&n!==''&&n!==null?Number(n).toLocaleString('en-US',{maximumFractionDigits:2})+' AED':'—';
const hrs=h=>h==null?'—':h<1?Math.round(h*60)+' дақ':h<48?(Math.round(h*10)/10)+' соат':Math.round(h/24)+' рӯз';
const digits=p=>String(p||'').replace(/\D/g,'').replace(/^00/,'');
const uname=id=>{const u=S.users[id];return u?(u.name||'Беном'):'—'};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const kc=s=>'k-'+((ST[s]||{}).k||'a');
const pill=s=>`<span class="pill ${kc(s)}">${esc((ST[s]||{l:s}).l)}</span>`;
const itemsOf=r=>Array.isArray(r.items)&&r.items.length?r.items:[{n:r.parts||'',q:r.qty||1,price:r.price||null,off:false}];
const itemsTxt=r=>itemsOf(r).filter(i=>!i.off).map(i=>i.n+(i.q>1?' × '+i.q:'')).join(', ');
const paidOf=r=>(r.payments||[]).reduce((a,p)=>a+(+p.a||0),0);
const balOf=r=>SOLD.includes(r.status)?Math.max(0,Math.round(((+r.price||0)-paidOf(r))*100)/100):0;
const deadline=r=>(r.createdAt||0)+URG[r.urgency&&URG[r.urgency]?r.urgency:'d3'].h*3600000;
const overdue=r=>PRE.includes(r.status)&&Date.now()>deadline(r);
function dueTxt(r){if(!PRE.includes(r.status))return'';const ms=deadline(r)-Date.now();if(ms<0)return'<span class="due late">Мӯҳлат гузашт</span>';const h=Math.floor(ms/3600000);return`<span class="due ${h<6?'soon':''}">${h<24?Math.max(1,h)+' соат монд':Math.floor(h/24)+' рӯз монд'}</span>`}
function custName(r){return r.customerId&&S.users[r.customerId]?S.users[r.customerId].name:(r.customerName||'Муштарӣ')}
function custPhone(r){return r.customerId&&S.users[r.customerId]?S.users[r.customerId].phone:(r.customerPhone||'')}
function waText(r){return`1. ${r.car||''}\n2. ${r.year||''}\n3. ${itemsOf(r).filter(i=>!i.off).map(i=>i.n+(i.q>1?' × '+i.q:'')).join('\n   ')}${r.vin?'\nVIN: '+r.vin:''}`}
function custMsg(r){
  const n=custName(r),c=r.code;
  if(r.status==='offered')return`Ассалому алайкум, ${n}!\nДархости №${c} (${r.car}) ёфт шуд:\n${itemsOf(r).filter(i=>!i.off).map(i=>'• '+i.n+(i.q>1?' × '+i.q:'')+(i.price?' — '+money(i.price):'')).join('\n')}\nҶамъ: ${money(r.price)}${r.warrantyDays?'\nКафолат: '+r.warrantyDays+' рӯз':''}\nБарои заказ ба сайт ворид шавед: ${location.origin+location.pathname}\nAUTO PESHSAF`;
  if(r.status==='ordered')return`Ассалому алайкум, ${n}! Закази №${c} қабул шуд. Ҷамъ: ${money(r.price)}${balOf(r)?', боқимонда: '+money(balOf(r)):''}.\nAUTO PESHSAF`;
  if(r.status==='shipped')return`Ассалому алайкум, ${n}! Закази №${c} дар роҳ аст.${r.tracking?' Пайгирӣ: '+r.tracking:''}\nAUTO PESHSAF`;
  if(r.status==='delivered')return`Ассалому алайкум, ${n}! Закази №${c} тайёр/супорида шуд.${balOf(r)?' Боқимонда: '+money(balOf(r))+'.':''} Ташаккур!\nAUTO PESHSAF`;
  if(r.status==='notfound')return`Ассалому алайкум, ${n}! Афсӯс, қисм аз дархости №${c} ҳоло ёфт нашуд.\nAUTO PESHSAF`;
  return`Ассалому алайкум, ${n}! Дархости №${c} дар ҷустуҷӯ аст.\nAUTO PESHSAF`;
}
const waLink=(ph,txt)=>'https://wa.me/'+digits(ph)+(txt?'?text='+encodeURIComponent(txt):'');
function toast(m){S.toast=m;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},3200)}
function matchQ(r){const q=S.q.trim().toLowerCase();if(!q)return true;return[r.code,r.car,r.year,itemsTxt(r),r.vin,custName(r),custPhone(r),r.supplier].join(' ').toLowerCase().includes(q)}
const errTxt=e=>{const c=e&&(e.code||'')||'';if(c.includes('permission'))return'иҷозат нест';if(c.includes('unavailable')||c.includes('network'))return'интернет нест';return'боз кӯшиш кунед'};

/* photos (stored in Firestore as small JPEG) */
const PH_PLACE='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="#8888"/></svg>');
function photosHtml(r){const ph=r.photos||[];if(!ph.length)return'';return`<div class="photos">${ph.map(p=>`<button class="thumb" data-act="lb" data-v="${esc(p.id)}"><img data-pid="${esc(p.id)}" src="${S.ph[p.id]||PH_PLACE}" alt="Акси қисм"><i>${p.k==='w'?'коргар':'муштарӣ'}</i></button>`).join('')}</div>`}
function fillPhotos(){app.querySelectorAll('img[data-pid]').forEach(img=>{const id=img.dataset.pid;if(S.ph[id]){if(img.src!==S.ph[id])img.src=S.ph[id];return}
  if(S.phLoading[id])return;S.phLoading[id]=true;getDoc(doc(db,'photos',id)).then(s=>{if(s.exists()){S.ph[id]=s.data().data;app.querySelectorAll('img[data-pid="'+id+'"]').forEach(x=>x.src=S.ph[id])}}).catch(()=>{})})}
function uplBtn(id,label){return`<label class="upl">${ICON_CAM}${label}<input type="file" accept="image/*" multiple data-up="${id}"></label>`}
async function toJpeg(f){const img=await createImageBitmap(f);let side=1000,q=.72,out='';
  for(let i=0;i<5;i++){const s=Math.min(1,side/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<700000)break;side*=.75;q-=.08}
  return out}
async function uploadFiles(files,kind,rid,cidv){
  const out=[];if(!files||!files.length)return out;
  for(const f of [...files].slice(0,6)){try{const data=await toJpeg(f);const ref=doc(collection(db,'photos'));await setDoc(ref,{rid,cid:cidv||null,data,k:kind,t:Date.now(),by:actor()});S.ph[ref.id]=data;out.push({id:ref.id,k:kind,t:Date.now()})}
    catch(e){toast('Акс бор нашуд ('+errTxt(e)+'). JPG ё PNG интихоб кунед.')}}
  return out;
}

/* roles */
const workers=()=>Object.entries(S.users).filter(([,u])=>u.role==='worker').sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
const idsOf=id=>[id];
const loadOf=id=>S.reqs.filter(r=>r.workerId===id&&ACTIVE.includes(r.status)).length;
function role(){return S.isAdmin?'admin':S.wid?'worker':S.cid?'customer':null}
function view(){if(S.isAdmin)return S.view||'admin';if(S.wid)return'worker';if(S.cid)return'customer';return'onboard'}
function actWorker(){if(!S.isAdmin)return S.wid;const ws=workers();if(!ws.some(([id])=>id===S.asWorker))S.asWorker=ws.length?ws[0][0]:null;return S.asWorker}
const actIds=()=>S.wid?[S.wid]:S.isAdmin&&view()==='worker'&&actWorker()?[actWorker()]:[];
const actor=()=>S.isAdmin?'admin':(S.wid||S.cid||'—');
const cid=()=>S.cid||'admin';
const isAdminView=()=>view()==='admin';
function crewBtn(id,u,on,act,extra){return`<button class="crew ${on?'on':''}" data-act="${act}" data-v="${id}" ${extra||''}><span class="av">${esc(initials(u.name))}</span><span style="min-width:0"><b>${esc(u.name)}</b><small>${esc(GRPS[u.group]||'')} · ${loadOf(id)} дар кор</small></span></button>`}
function translit(s){const m={а:'a',б:'b',в:'v',г:'g',ғ:'gh',д:'d',е:'e',ё:'yo',ж:'zh',з:'z',и:'i',ӣ:'i',й:'y',к:'k',қ:'q',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ӯ:'u',ф:'f',х:'kh',ҳ:'h',ч:'ch',ҷ:'j',ш:'sh',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};return String(s||'').toLowerCase().split('').map(c=>m[c]??c).join('').replace(/[^a-z0-9]/g,'')}
const cleanLogin=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9._-]/g,'');

/* merge raw docs into the shape the views use */
function rebuild(){
  const u={admin:{name:'Роҳбар',role:'admin'}};
  for(const [id,w] of Object.entries(S.workers))u[id]={...w,role:w.active===false?'removed':'worker'};
  for(const [id,c] of Object.entries(S.customers))u[id]={...c,role:'customer'};
  S.users=u;
  const all={...S.extra,...S.rawReqs};
  S.reqs=Object.entries(all).map(([id,d])=>{
    const p=S.privs[id]||{};const custOff=d.custOff||[];
    const items=itemsOf(d).map((it,i)=>({...it,off:!!it.off||custOff.includes(i)}));
    const priced=items.some(it=>it.price>0);
    const price=priced?items.filter(it=>!it.off).reduce((a,it)=>a+(+it.price||0),0):(d.price||null);
    return{id,...d,...p,items,price,log:d.log||[],plog:p.log||[]};
  }).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

/* ===== stats ===== */
function periodStart(){const d=new Date();d.setHours(0,0,0,0);if(S.period==='today')return+d;if(S.period==='month'){d.setDate(1);return+d}if(S.period==='week'){d.setDate(d.getDate()-6);return+d}return 0}
const inPer=r=>(r.createdAt||0)>=periodStart();
const wasFound=r=>!!r.foundAt||['found','offered',...SOLD,'returned'].includes(r.status)||(r.status==='cancelled'&&!!r.offeredAt);
const wasOffered=r=>!!r.offeredAt||['offered',...SOLD,'returned'].includes(r.status);
function wStats(id,from){
  const rs=S.reqs.filter(r=>r.workerId===id&&(r.createdAt||0)>=(from||0));
  const found=rs.filter(wasFound).length,open=rs.filter(r=>['assigned','searching'].includes(r.status)).length,nf=rs.filter(r=>r.status==='notfound').length;
  const sold=rs.filter(r=>SOLD.includes(r.status));
  const rev=sold.reduce((a,r)=>a+(+r.price||0),0),profit=sold.reduce((a,r)=>a+((+r.price||0)-(+r.cost||0)),0);
  const ft=rs.filter(r=>r.foundAt&&r.assignedAt).map(r=>(r.foundAt-r.assignedAt)/3600000);
  return{total:rs.length,found,open,nf,sold:sold.length,rev,profit,late:rs.filter(overdue).length,avg:ft.length?ft.reduce((a,b)=>a+b,0)/ft.length:null,rate:found+nf?Math.round(found/(found+nf)*100):null};
}
function supStats(from){
  const m={};
  S.reqs.filter(r=>(r.createdAt||0)>=from).forEach(r=>{const qs=r.quotes||[];const min=Math.min(...qs.map(x=>+x.cost||Infinity));
    qs.forEach(q=>{const k=(q.sup||'').trim().toLowerCase();if(!k)return;const s=m[k]||(m[k]={name:q.sup.trim(),ph:'',quotes:0,won:0,ret:0,cheap:0,eta:[]});
      s.quotes++;if(q.ph&&!s.ph)s.ph=q.ph;if(q.eta)s.eta.push(+q.eta);if(qs.length>1&&+q.cost===min)s.cheap++;
      if(r.chosenQ===q.id){s.won++;if(r.status==='returned')s.ret++}})});
  return Object.values(m).sort((a,b)=>b.won-a.won||b.quotes-a.quotes);
}

/* ===== views ===== */
function header(){
  const v=view();
  const sw=S.isAdmin?`<div class="seg">${[['admin','Роҳбар'],['worker','Коргар'],['customer','Муштарӣ']].map(([k,l])=>`<button data-act="view" data-v="${k}" class="${v===k?'on':''}">${l}</button>`).join('')}</div>`:'';
  const out=S.isAdmin||S.wid||S.cid?`<button class="btn" data-act="logout" style="height:36px;padding:0 10px">Баромадан</button>`:'';
  const who=S.isAdmin?'Роҳбар':S.wid||S.cid?uname(S.wid||S.cid):'';
  const sub={admin:'Панели идора',worker:'Панели коргар',customer:'Дархостҳои ман',onboard:'Воридшавӣ'}[v]||'';

  const tabs={new:pool.filter(r=>r.status==='assigned'),work:pool.filter(r=>r.status==='searching'&&mine(r)),
    done:pool.filter(r=>['found','offered',...SOLD,'returned','notfound'].includes(r.status)&&mine(r)),all:pool.filter(r=>mine(r)&&ACTIVE.includes(r.status))};
  const labels={new:['Нав барои ман','k-n'],work:['Дар ҷустуҷӯ','k-s'],done:['Ёфтаҳои ман','k-d'],all:['Ҳамаи корҳои ман','']};
  const ws=workers();
  const late=pool.filter(r=>mine(r)&&overdue(r)).length;
  const head=isAdm?(ws.length?`<div class="note">Панели кадом коргарро бинед? Ҳар коргар танҳо дархостҳои худашро мебинад.</div><div class="tool"><select data-act="awsel" id="aw" class="chip" style="width:auto;flex:1">${ws.map(([id,u])=>`<option value="${id}" ${aw===id?'selected':''}>${esc(u.name)} · ${esc(GRPS[u.group]||'')}</option>`).join('')}</select>${searchBox('Ҷустуҷӯ')}</div>`:`<div class="note">Аввал дар қисми «Одамон» коргар илова кунед.</div>`)
    :`<div class="note">Гурӯҳи шумо: <b>${esc(GRPS[g0]||'—')}</b>. Барои ҳар дархост нархи якчанд паставшикро нависед — роҳбар беҳтаринашро интихоб мекунад.</div><div class="tool">${searchBox('Ҷустуҷӯ')}</div>`;
  return head+(late?`<button class="alert" data-act="wt" data-v="work">${late} дархост мӯҳлаташ гузашт<span class="arr">→</span></button>`:'')+pipe(Object.keys(labels).map(k=>[k,labels[k][0],tabs[k].length,labels[k][1]]),S.wTab,'wt')+cards(tabs[S.wTab]||[],S.wTab==='all');
}

      <div><button class="link" data-act="delreq" data-id="${r.id}" style="color:var(--bad)">${S.confirmDel===r.id?'Барои тасдиқ боз пахш кунед — дархост тамоман нест мешавад':'Дархостро нест кардан'}</button></div></div>`;
    if(r.status!=='offered')act+=msgCard;
  }
  if(v==='worker'){
    if(r.status==='assigned'&&(!r.workerId||isMine))act+=`<div class="card"><h3>Кор</h3><div><button class="btn pri" data-act="take" data-id="${r.id}">Ба кор гирифтан</button></div></div>`;

      act+=quotesHtml(r,v,true);
      if(r.status==='searching')act+=`<div class="card"><h3>Натиҷа</h3><label>Эзоҳ ба роҳбар<input id="w-note-${r.id}" value="${esc(r.workerNote||'')}" placeholder="Сифат, мӯҳлат, оригинал/копия"></label>
        <div class="bar"><button class="btn ok" data-act="found" data-id="${r.id}" ${(r.quotes||[]).length?'':'disabled'}>Ёфт шуд</button><button class="btn bad" data-act="notfound" data-id="${r.id}">Ёфт нашуд</button></div>${(r.quotes||[]).length?'':'<div class="small muted">Барои «Ёфт шуд» камаш як нарх илова кунед.</div>'}</div>`;
      else act+=`<div class="note">Роҳбар нархро интихоб мекунад ва ба муштарӣ мефиристад.</div>`;
    }else if((r.quotes||[]).length&&isMine)act+=quotesHtml(r,v,false);

  const wa=`<div class="card"><h3>Матн барои паставшик (WhatsApp)</h3><div class="wa" id="wa-${r.id}">${esc(waText(r))}</div><div class="bar"><button class="btn" data-act="copy" data-id="${r.id}">Нусха гирифтан</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(waText(r))}" target="_blank" rel="noopener">WhatsApp кушодан</a></div></div>`;
  const logs=r.log.concat(r.plog).sort((a,b)=>b.t-a.t);
  const log=`<div class="card"><h3>Таърих</h3><ul class="log">${logs.map(l=>`<li><time>${fmt(l.t)}</time><span>${esc(l.s)} <span class="muted">· ${esc(uname(l.by))}</span></span></li>`).join('')}</ul></div>`;
  return`<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true" data-stop="1"><div class="sheet-h"><span class="tag">${esc(r.code)}</span>${pill(r.status)}<span class="urg ${r.urgency||'d3'}">${URG[r.urgency||'d3'].l}</span><button class="x" data-act="close" aria-label="Пӯшидан">×</button><div class="ttl">${esc(itemsTxt(r))}</div></div>
    <div class="card">${info}</div><div class="card"><h3>Қисмҳо</h3>${itemsBox}${mg}</div><div class="card"><h3>Аксҳо</h3>${photos}</div>${act}${wa}${log}</div></div>`;
}

function body(){
  if(S.denied)return`<div class="login"><div class="card"><h2>Дастрасӣ нест</h2><p class="muted" style="margin:0">${esc(S.denied)}</p><div><button class="btn" data-act="logout">Баромадан</button></div></div></div>`;
  if(!S.authReady||!S.ready)return`<div class="empty"><b>${S.slow?'Пайвастшавӣ суст аст':'Бор шуда истодааст…'}</b>${S.slow?'<span class="small">Интернетро санҷед; саҳифа худаш боз кӯшиш мекунад.</span>':''}</div>`;
  return{admin:adminView,worker:workerView,customer:customerView,onboard:onboardView}[view()]();
}
function render(){
  const keep={};app.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{if(['q','fg','aw'].includes(e.id)||e.type==='file'||e.tagName==='TEXTAREA'&&e.hidden)return;keep[e.id]=e.type==='radio'||e.type==='checkbox'?e.checked:e.value});
  const files=document.getElementById('n-photo')?.files||null;
  const f=document.activeElement&&document.activeElement.id;
  const sc=app.querySelector('.sheet')?.scrollTop||0;
  app.innerHTML=header()+`<main class="wrap">${body()}</main>`+sheet()+(S.lb?`<div class="lb" data-act="lbclose"><img data-pid="${esc(S.lb)}" src="${S.ph[S.lb]||PH_PLACE}" alt="Акс"></div>`:'')+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  for(const id in keep){const e=document.getElementById(id);if(!e)continue;if(e.type==='radio'||e.type==='checkbox')e.checked=keep[id];else e.value=keep[id]}
  if(files&&files.length){const e=document.getElementById('n-photo');if(e){try{e.files=files}catch(_){}const n=document.getElementById('n-photo-n');if(n)n.textContent=files.length+' акс интихоб шуд'}}
  const sh=app.querySelector('.sheet');if(sh)sh.scrollTop=sc;
  if(S.open)calcPP(S.open);
  fillPhotos();
  if(f){const e=document.getElementById(f);if(e){e.focus();if(e.id==='q'){const n=e.value.length;try{e.setSelectionRange(n,n)}catch(_){}}}}
}

/* ===== writes ===== */
const qd={};
function queued(id,fn){qd[id]=(qd[id]||Promise.resolve()).then(fn,fn);return qd[id]}
async function upd(id,patch,txt,silent){
  const r=S.reqs.find(x=>x.id===id);if(!r)return false;
  const pub={},priv={};for(const k in patch)(PRIV_KEYS.includes(k)?priv:pub)[k]=patch[k];
  const entry={t:Date.now(),by:actor(),s:txt};
  const hasPriv=Object.keys(priv).length>0;
  try{
    await queued(id,async()=>{
      if(Object.keys(pub).length||!hasPriv){pub.updatedAt=Date.now();if(!hasPriv)pub.log=(r.log||[]).concat([entry]).slice(-50);await updateDoc(doc(db,'requests',id),pub)}
      if(hasPriv){priv.workerId=('workerId' in pub?pub.workerId:r.workerId)||null;priv.log=(r.plog||[]).concat([entry]).slice(-50);await setDoc(doc(db,'priv',id),priv,{merge:true})}
    });
    if(!silent)toast(txt);return true;
  }catch(e){toast('Сабт нашуд: '+errTxt(e));return false}
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const fnum=id=>{const v=parseFloat(val(id));return isFinite(v)?v:null};
function calcPP(id){
  const r=S.reqs.find(x=>x.id===id);const pt=document.getElementById('pt-'+id),pp=document.getElementById('pp-'+id);if(!r||!pt)return;
  let sum=0,any=false;document.querySelectorAll('[data-pp="'+id+'"]').forEach(el=>{const v=parseFloat(el.value);if(isFinite(v)){sum+=v;any=true}});
  pt.textContent=any?money(sum):'—';
  if(pp){if(any&&r.cost){const p=sum-r.cost;pp.textContent=money(Math.round(p*100)/100)+(sum?' · '+Math.round(p/sum*100)+'%':'');pp.style.color=p<0?'var(--bad)':''}else pp.textContent='—'}
}

document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}else if(e.target.dataset&&e.target.dataset.pp)calcPP(e.target.dataset.pp)});
document.addEventListener('submit',async e=>{
  e.preventDefault();const fid=e.target.id;
  if(fid==='f-clogin'){
    const name=val('o-name'),dg=digits(val('o-phone'));
    if(!name){S.loginErr='Номатонро нависед.';render();return}
    if(dg.length<7||dg.length>15){S.loginErr='Рақами WhatsApp-ро пурра бо коди кишвар нависед (масалан +971 50 123 4567).';render();return}
    const id='c-'+dg;S.busy=true;S.loginErr='';render();
    try{
      const cred=auth.currentUser&&auth.currentUser.isAnonymous?{user:auth.currentUser}:await signInAnonymously(auth);
      await setDoc(doc(db,'sessions',cred.user.uid),{cid:id,t:Date.now()});
      const cs=await getDoc(doc(db,'customers',id));
      if(!cs.exists())await setDoc(doc(db,'customers',id),{name,phone:'+'+dg,createdAt:Date.now()});
      S.busy=false;await startCustomer(id);toast('Хуш омадед, '+((cs.exists()&&cs.data().name)||name));
    }catch(err){S.busy=false;S.loginErr='Ворид шуда нашуд ('+errTxt(err)+'). Интернетро санҷед ва боз кӯшиш кунед.';render()}
    return;
  }
  if(fid==='f-login'){
    const lg=cleanLogin(val('l-login')),pw=document.getElementById('l-pass').value;if(!lg||!pw)return;
    S.busy=true;S.loginErr='';render();
    try{await signInWithEmailAndPassword(auth,lg+'@'+WORKER_DOMAIN,pw);S.busy=false;const x=document.getElementById('l-pass');if(x)x.value=''}
    catch(err){S.busy=false;const c=err.code||'';S.loginErr=c.includes('too-many')?'Бисёр кӯшиш шуд. Чанд дақиқа интизор шавед.':c.includes('network')?'Интернет нест.':'Логин ё парол нодуруст аст.';render()}
    return;
  }
  if(fid==='f-addw'||fid==='f-cred'){
    const isNew=fid==='f-addw';
    const lg=cleanLogin(val(isNew?'aw-login':'c-login')),pw=document.getElementById(isNew?'aw-pass':'c-pass').value;
    if(lg.length<3){toast('Логин бояд камаш 3 ҳарфи лотинӣ бошад');return}
    if(pw.length<6){toast('Парол бояд камаш 6 рамз бошад');return}
    if(Object.values(S.workers).some(w=>w.login===lg)){toast('Ин логин банд аст. Логини дигар нависед.');return}
    const name=isNew?val('aw-name'):'';if(isNew&&!name){toast('Номи коргарро нависед');return}
    S.busy=true;render();
    try{
      const sa=secondaryAuth();const cr=await createUserWithEmailAndPassword(sa,lg+'@'+WORKER_DOMAIN,pw);const uid=cr.user.uid;await signOut(sa);
      if(isNew){const wid='w-'+(translit(name)||'w')+'-'+Date.now().toString(36).slice(-4);
        await setDoc(doc(db,'workers',wid),{name,phone:val('aw-phone'),group:val('aw-group')||'all',login:lg,uid,active:true,createdAt:Date.now()});
        await setDoc(doc(db,'staff',uid),{wid});
        ['aw-name','aw-phone','aw-login','aw-pass'].forEach(i=>{const x=document.getElementById(i);if(x)x.value=''});
        S.busy=false;toast('Коргар илова шуд. Логин: '+lg+' · Парол: '+pw);
      }else{const wid=e.target.dataset.id,w=S.workers[wid]||{};
        if(w.uid)await deleteDoc(doc(db,'staff',w.uid)).catch(()=>{});
        await setDoc(doc(db,'staff',uid),{wid});await updateDoc(doc(db,'workers',wid),{login:lg,uid});
        S.credFor=null;S.busy=false;toast('Сабт шуд. Логин: '+lg+' · Парол: '+pw);
      }
    }catch(err){S.busy=false;const c=err.code||'';toast(c.includes('email-already-in-use')?'Ин логин аллакай истифода шудааст. Логини дигар нависед.':c.includes('weak-password')?'Парол суст аст (камаш 6 рамз).':'Сабт нашуд: '+errTxt(err))}
    return;
  }
  if(fid==='f-new'){
    const forAdmin=view()==='admin';
    const car=val('n-car');if(!car)return;
    const items=[];for(let i=0;i<S.nItems;i++){const n=val('n-it-'+i);if(n)items.push({n,q:Math.max(1,parseInt(val('n-iq-'+i))||1),price:null,off:false})}
    if(!items.length){toast('Камаш як қисмро нависед');return}
    const vin=val('n-vin').toUpperCase().replace(/\s/g,'');
    const fileEl=document.getElementById('n-photo');const files=fileEl?fileEl.files:null;
    if(!vin&&!(files&&files.length)&&!forAdmin){toast('VIN ё акси қисмро илова кунед');return}
    if(vin&&vin.length!==17&&!forAdmin){toast('VIN бояд 17 рамз бошад. Аз техпаспорт санҷед.');return}
    const cond=(document.querySelector('input[name="n-cond"]:checked')||{}).value||'any';
    const urg=(document.querySelector('input[name="n-urg"]:checked')||{}).value||'d3';
    S.busy=true;render();
    const ref=doc(collection(db,'requests'));const now=Date.now();
    let custId=forAdmin?null:S.cid,cname='',cphone='';
    if(forAdmin){cname=val('n-cname');const dg=digits(val('n-cphone'));cphone=dg?'+'+dg:'';
      if(dg.length>=7){custId='c-'+dg;if(!S.customers[custId]){try{await setDoc(doc(db,'customers',custId),{name:cname,phone:cphone,createdAt:now})}catch(_){}}}}
    const photos=await uploadFiles(files,forAdmin?'w':'c',ref.id,custId);
    const d={code:String(now).slice(-6),car,year:val('n-year'),items,parts:items.map(i=>i.n).join(', '),vin,condition:cond,urgency:urg,note:val('n-note'),photos,
      status:'new',group:cond==='any'?null:cond,workerId:null,customerId:custId,customerName:cname,customerPhone:cphone,createdAt:now,updatedAt:now,log:[{t:now,by:actor(),s:'Дархост сохта шуд'}]};
    let priv=null;
    if(forAdmin){const man=document.getElementById('n-man');
      if(man&&man.checked){const cost=fnum('n-cost'),price=fnum('n-price'),sup=val('n-sup');
        if(!(price>0)){S.busy=false;render();toast('Барои закази фаврӣ нархи фурӯшро нависед');return}
        const qid='q'+now.toString(36);
        d.items=items.map((it,i)=>({...it,price:i===0?price:0}));d.status='ordered';d.orderedAt=now;d.offeredAt=now;d.manual=true;d.log.push({t:now,by:actor(),s:'Заказ бе ҷустуҷӯ: '+money(price)});
        priv={quotes:sup||cost?[{id:qid,sup:sup||'—',cost:cost||0,kind:cond==='used'?'used':'orig',by:actor(),t:now}]:[],chosenQ:sup||cost?qid:null,cost:cost||null,supplier:sup,workerId:null,log:[]}}}
    try{await setDoc(ref,d);if(priv)await setDoc(doc(db,'priv',ref.id),priv);
      S.newReq=false;S.nItems=1;
      app.querySelectorAll('#f-new input:not([type=radio]):not([type=checkbox])').forEach(x=>{if(x.type==='file'){x.value='';return}x.value=x.type==='number'&&x.id.startsWith('n-iq')?'1':''});
      S.busy=false;toast('Дархост фиристода шуд')}
    catch(err){S.busy=false;toast('Фиристода нашуд: '+errTxt(err))}
  }
});

document.addEventListener('click',async e=>{

    case'rtab':S.repTab=b.dataset.v;break;

    case'wt':S.wTab=b.dataset.v;break;

        S.loginErr=c.includes('unauthorized-domain')?'Ин суроға дар Firebase иҷозат надорад (Authorized domains).':c.includes('popup-closed')?'Равзана пӯшида шуд. Боз кӯшиш кунед.':'Ворид шуда нашуд: '+(c||'хато')}

      S.fStatus=k;S.fWorker='all';S.fGroup='all';S.q='';render();setTimeout(()=>{const x=document.getElementById('list-anchor');if(x)x.scrollIntoView({behavior:'smooth',block:'start'})},30);return}
    case'markup':{if(!r||!r.cost)return;const i=itemsOf(r).findIndex(x=>!x.off);const el=document.getElementById('d-ip-'+id+'-'+i);if(el){el.value=Math.ceil(r.cost*(1+(+b.dataset.v)/100));calcPP(id)}return}
    case'copy':case'copytxt':{const t=a==='copy'?waText(r):(document.getElementById(b.dataset.v)||{}).value||'';try{await navigator.clipboard.writeText(t);toast('Нусха гирифта шуд')}catch(_){toast('Нусха нашуд — матнро дастӣ интихоб кунед')}return}
    case'assign':{const g=val('d-group-'+id);if(!g)return;await upd(id,{group:g,workerId:null,assignedAt:r.assignedAt||Date.now(),status:['new','assigned','notfound'].includes(r.status)?'assigned':r.status},'Ба гурӯҳ фиристода шуд: '+GRP[g]);
      if(S.privs[id])setDoc(doc(db,'priv',id),{workerId:null},{merge:true}).catch(()=>{});return}
    case'assignto':{const w=b.dataset.v,u=S.users[w];if(!u||r.workerId===w)return;const grp=u.group&&u.group!=='all'?u.group:(r.group||(r.condition==='used'?'used':'new'));
      if(await upd(id,{workerId:w,group:grp,assignedAt:Date.now(),status:['new','assigned','notfound'].includes(r.status)?'assigned':r.status},'Масъул: '+u.name))
        setDoc(doc(db,'priv',id),{workerId:w},{merge:true}).catch(()=>{});return}
    case'take':{const w=S.wid||actWorker();if(!w)return;
      if(await upd(id,{workerId:w,status:'searching',assignedAt:r.assignedAt||Date.now()},'Ба кор гирифт: '+uname(w)))
        setDoc(doc(db,'priv',id),{workerId:w},{merge:true}).catch(()=>{});return}
    case'addq':{const sup=val('q-sup-'+id),cost=fnum('q-cost-'+id);if(!sup||!(cost>0)){toast('Номи паставшик ва нархро нависед');return}
      const q={id:'q'+Date.now().toString(36),sup,cost,kind:val('q-kind-'+id)||'orig',eta:val('q-eta-'+id),ph:val('q-ph-'+id),note:val('q-note-'+id),by:actor(),t:Date.now()};
      if(await upd(id,{quotes:(r.quotes||[]).concat([q])},'Нарх: '+sup+' · '+money(cost)))['q-sup-','q-cost-','q-eta-','q-ph-','q-note-'].forEach(p=>{const x=document.getElementById(p+id);if(x)x.value=''});return}
    case'delq':{const qid=b.dataset.q;const patch={quotes:(r.quotes||[]).filter(q=>q.id!==qid)};if(r.chosenQ===qid)patch.chosenQ=null;await upd(id,patch,'Нарх нест карда шуд');return}
    case'chooseq':{const q=(r.quotes||[]).find(x=>x.id===b.dataset.q);if(!q)return;await upd(id,{chosenQ:q.id,cost:q.cost,supplier:q.sup,supplierPhone:q.ph||''},'Интихоб: '+q.sup+' · '+money(q.cost));return}
    case'found':{if(!(r.quotes||[]).length){toast('Камаш як нарх илова кунед');return}const best=r.quotes.slice().sort((x,y)=>x.cost-y.cost)[0];
      if(await upd(id,{status:'found',foundAt:Date.now()},'Ёфт шуд · '+r.quotes.length+' нарх',true))
        await upd(id,{workerNote:val('w-note-'+id),chosenQ:r.chosenQ||best.id,cost:r.chosenQ?r.cost:best.cost,supplier:r.chosenQ?r.supplier:best.sup},'Нархи беҳтарин: '+(r.chosenQ?r.supplier:best.sup)+' · '+money(r.chosenQ?r.cost:best.cost));return}
    case'notfound':{const note=val('w-note-'+id);if(await upd(id,{status:'notfound'},'Ёфт нашуд'))if(note)upd(id,{workerNote:note},'Эзоҳ: '+note,true);return}
    case'offer':{const its=itemsOf(r).map((it,i)=>it.off?it:{...it,price:fnum('d-ip-'+id+'-'+i)});
      if(its.some(it=>!it.off&&!(it.price>0))){toast('Нархи ҳар қисмро нависед');return}
      const total=its.filter(i=>!i.off).reduce((a,i)=>a+i.price,0),again=r.status==='offered';
      if(await upd(id,{items:its,custOff:[],price:total,offerNote:val('d-onote-'+id),warrantyDays:parseInt(val('d-war-'+id))||0,status:'offered',offeredAt:r.offeredAt||Date.now()},(again?'Нархи нав ба муштарӣ: ':'Нарх ба муштарӣ: ')+money(total),true))
        toast((again?'Нархи нав':'Нарх')+' фиристода шуд: '+money(total)+'. Акнун «Дар WhatsApp фиристодан»-ро пахш кунед.');return}
    case'item-off':{const i=+b.dataset.i,off=new Set((S.rawReqs[id]||{}).custOff||[]);off.has(i)?off.delete(i):off.add(i);
      const its=itemsOf(S.rawReqs[id]||r);if(its.every((x,k)=>x.off||off.has(k))){toast('Камаш як қисм бояд монад. Ё «Лозим нест»-ро пахш кунед.');return}
      await upd(id,{custOff:[...off]},(off.has(i)?'Лозим нест: ':'Баргардонд: ')+its[i].n);return}
    case'addpay':{const amt=fnum('p-amt-'+id),cur=val('p-cur-'+id)||'AED',rate=fnum('p-rate-'+id)||S.lastRate;if(!(amt>0)){toast('Маблағро нависед');return}
      const a2=cur==='TJS'?Math.round(amt/rate*100)/100:amt;if(cur==='TJS')S.lastRate=rate;
      const p={a:a2,cur,orig:amt,rate:cur==='TJS'?rate:1,note:val('p-note-'+id),t:Date.now(),by:actor()};
      await upd(id,{payments:(r.payments||[]).concat([p])},'Пардохт: '+money(a2)+(cur==='TJS'?' ('+num(amt)+' TJS)':''));return}
    case'ship':await upd(id,{status:'shipped',tracking:val('t-trk-'+id),shippedAt:Date.now()},'Дар роҳ'+(val('t-trk-'+id)?': '+val('t-trk-'+id):''));return;
    case'deliver':await upd(id,{status:'delivered',deliveredAt:Date.now()},'Ба муштарӣ дода шуд');return;
    case'return':{const why=val('ret-'+id);if(!why){toast('Сабаби бозгаштро нависед');return}await upd(id,{status:'returned',returnReason:why,returnedAt:Date.now()},'Баргашт: '+why);return}
    case'setstatus':{const s=val('d-status-'+id);if(s===r.status)return;await upd(id,{status:s},'Ҳолат: '+ST[s].l);return}
    case'setcost':{const c=fnum('d-cost-'+id);await upd(id,{cost:c},'Нархи харид: '+money(c));return}
    case'delreq':{if(S.confirmDel!==id){S.confirmDel=id;break}
      try{await deleteDoc(doc(db,'requests',id));await deleteDoc(doc(db,'priv',id)).catch(()=>{});for(const p of (r.photos||[]))deleteDoc(doc(db,'photos',p.id)).catch(()=>{});S.open=null;S.confirmDel=null;toast('Дархост нест карда шуд')}catch(err){toast('Нест нашуд: '+errTxt(err))}return}
    case'cust-accept':await upd(id,{status:'ordered',orderedAt:Date.now()},'Муштарӣ заказ дод');return;
    case'cust-decline':await upd(id,{status:'cancelled'},'Муштарӣ рад кард');return;
    case'cust-cancel':await upd(id,{status:'cancelled'},'Муштарӣ бекор кард');return;
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.lb)S.lb=null;else if(S.open)S.open=null;else return;render()}});
setInterval(()=>{const ae=document.activeElement;if(!ae||ae===document.body)render()},60000);

/* ===== data subscriptions ===== */
function stopAll(){unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];S.rawReqs={};S.extra={};S.privs={};S.workers={};S.customers={}}
function sub(q,fn,label){unsubs.push(onSnapshot(q,fn,err=>{console.warn(label,err);toast('Маълумот бор нашуд ('+errTxt(err)+')')}))}
function waitAll(n){let left=n;S.ready=false;const t=setTimeout(()=>{S.slow=true;render()},10000);return()=>{if(--left<=0){clearTimeout(t);S.ready=true;S.slow=false}rebuild();render()}}
function startAdmin(){
  stopAll();const done=waitAll(4);
  const firstOnce=f=>{let first=true;return s=>{f(s);if(first){first=false;done()}else{rebuild();render()}}};
  sub(query(collection(db,'requests'),orderBy('createdAt','desc'),limit(1500)),firstOnce(s=>{S.rawReqs={};s.forEach(d=>S.rawReqs[d.id]=d.data())}),'requests');
  sub(collection(db,'priv'),firstOnce(s=>{S.privs={};s.forEach(d=>S.privs[d.id]=d.data())}),'priv');
  sub(collection(db,'workers'),firstOnce(s=>{S.workers={};s.forEach(d=>S.workers[d.id]=d.data())}),'workers');
  sub(collection(db,'customers'),firstOnce(s=>{S.customers={};s.forEach(d=>S.customers[d.id]=d.data())}),'customers');
}
function startWorker(wid){
  stopAll();S.wid=wid;const done=waitAll(4);
  const firstOnce=f=>{let first=true;return s=>{f(s);if(first){first=false;done()}else{rebuild();render()}}};
  sub(query(collection(db,'requests'),where('workerId','==',wid)),firstOnce(s=>{S.rawReqs={};s.forEach(d=>S.rawReqs[d.id]=d.data())}),'my requests');
  sub(query(collection(db,'requests'),where('status','==','assigned'),where('workerId','==',null)),firstOnce(s=>{S.extra={};s.forEach(d=>S.extra[d.id]=d.data())}),'open requests');
  sub(query(collection(db,'priv'),where('workerId','==',wid)),firstOnce(s=>{S.privs={};s.forEach(d=>S.privs[d.id]=d.data())}),'priv');
  sub(collection(db,'workers'),firstOnce(s=>{S.workers={};s.forEach(d=>S.workers[d.id]=d.data())}),'workers');
}
async function startCustomer(cidv){
  stopAll();S.cid=cidv;const done=waitAll(2);
  const firstOnce=f=>{let first=true;return s=>{f(s);if(first){first=false;done()}else{rebuild();render()}}};
  sub(query(collection(db,'requests'),where('customerId','==',cidv)),firstOnce(s=>{S.rawReqs={};s.forEach(d=>S.rawReqs[d.id]=d.data())}),'my requests');
  sub(doc(db,'customers',cidv),firstOnce(s=>{S.customers={};if(s.exists())S.customers[cidv]=s.data()}),'me');
}

/* ===== auth ===== */
render();
getRedirectResult(auth).catch(()=>{});
onAuthStateChanged(auth,async user=>{
  S.isAdmin=false;S.wid=null;S.cid=null;S.denied=null;S.view=null;
  if(!user){stopAll();S.authReady=true;S.ready=true;rebuild();render();return}
  S.authReady=true;S.ready=false;render();
  try{
    const email=(user.email||'').toLowerCase();
    if(!user.isAnonymous&&ADMIN_EMAILS.includes(email)){S.isAdmin=true;startAdmin();return}
    if(email.endsWith('@'+WORKER_DOMAIN)){
      const st=await getDoc(doc(db,'staff',user.uid));
      if(!st.exists()){S.denied='Ин логин дигар фаъол нест. Аз роҳбар логини нав гиред.';S.ready=true;render();return}
      startWorker(st.data().wid);return}
    if(user.isAnonymous){
      const ss=await getDoc(doc(db,'sessions',user.uid));
      if(ss.exists()&&ss.data().cid){await startCustomer(ss.data().cid);return}
      S.ready=true;render();return}
    S.denied='Почтаи '+email+' роҳбар нест. Агар муштарӣ бошед, бароед ва бо рақами WhatsApp ворид шавед.';S.ready=true;render();
  }catch(err){S.denied='Маълумот бор нашуд ('+errTxt(err)+').';S.ready=true;render()}
});
</script>
