<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c3557">
<meta name="description" content="Системаи идораи дархостҳо: муштариён, коргарон ва роҳбар.">
<title>Дархостҳо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Classic-modern: navy ink + brass, PT Serif for titles and figures, PT Sans for text.
   Layout: sticky brand bar, one 1040px work column; details open as side panel (desktop) or bottom sheet (phone). */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#eef1f5; --ink:#141c2a; --muted:#5b6676; --line:#dce1e8;
  --primary:#1c3557; --primary-ink:#ffffff; --primary-soft:#e5ebf4; --tag:#b07f2c; --tag-ink:#ffffff; --brass:#a87a2a;
  --ok:#17784a; --ok-bg:#ddf1e5; --warn:#9a5c00; --warn-bg:#fbefd6; --info:#1f4f94; --info-bg:#e1e9f6;
  --bad:#a92b2b; --bad-bg:#f9e2e2; --neutral:#778395; --neutral-bg:#e7ebf0; --violet:#5b3fa8; --violet-bg:#ebe5f8;
  --shadow:0 1px 2px rgba(20,28,42,.05),0 6px 18px rgba(20,28,42,.05); --scrim:rgba(8,12,20,.5);
  --display:"PT Serif",Georgia,"Times New Roman",serif; --body:"PT Sans","Segoe UI",Roboto,system-ui,sans-serif; --mono:"PT Mono",ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c111a; --surface:#141b27; --surface2:#1a2331; --ink:#e7ebf1; --muted:#909bab; --line:#243045;
  --primary:#93b2e2; --primary-ink:#0a1222; --primary-soft:#192539; --tag:#d6a748; --tag-ink:#1d1400; --brass:#d6a748;
  --ok:#62cf93; --ok-bg:#122e1f; --warn:#efbd63; --warn-bg:#33260d; --info:#8bb5f2; --info-bg:#15253b;
  --bad:#f09494; --bad-bg:#371a1a; --neutral:#909bab; --neutral-bg:#212a38; --violet:#b9a3f1; --violet-bg:#261f3c;
  --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111a; --surface:#141b27; --surface2:#1a2331; --ink:#e7ebf1; --muted:#909bab; --line:#243045;
  --primary:#93b2e2; --primary-ink:#0a1222; --primary-soft:#192539; --tag:#d6a748; --tag-ink:#1d1400; --brass:#d6a748;
  --ok:#62cf93; --ok-bg:#122e1f; --warn:#efbd63; --warn-bg:#33260d; --info:#8bb5f2; --info-bg:#15253b;
  --bad:#f09494; --bad-bg:#371a1a; --neutral:#909bab; --neutral-bg:#212a38; --violet:#b9a3f1; --violet-bg:#261f3c;
  --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--brass) 55%,transparent)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:38px;height:38px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font:700 15px var(--display);letter-spacing:.04em;flex:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brass) 70%,transparent)}
.brand{min-width:0;flex:1}
.brand b{display:block;font:700 17px/1.2 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;order:2}
.hrow>.seg{order:3}
@media (max-width:640px){.hrow{flex-wrap:wrap}.hrow>.seg{flex-basis:100%}.hrow>.seg button{flex:1}}
.seg button{border:0;background:none;color:var(--muted);font:700 12.5px var(--body);padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

main{padding-block:18px 100px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 23px/1.25 var(--display)} h2{font:700 18px/1.3 var(--display)}
h3{font:700 11.5px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.muted{color:var(--muted)} .small{font-size:13px} .spacer{flex:1}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:16px;font:700 14.5px var(--body);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
.badge{background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
button.kpi{text-align:left;cursor:pointer;width:100%;font:inherit;color:var(--ink)}
button.kpi:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font:700 26px/1.2 var(--display);font-variant-numeric:lining-nums tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b small{font:700 12px var(--body);color:var(--muted);margin-left:4px}
.kpi.pos b{color:var(--ok)}
.kpi.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.kpi .go{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--primary);margin-top:2px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* pipeline + alerts */
.pipe-wrap{overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.pipe-wrap::-webkit-scrollbar{display:none}
.pipe{display:flex;gap:8px;width:max-content}
.st{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 10px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--neutral))}
.st b{font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.st.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.st.on b{background:color-mix(in srgb,var(--primary-ink) 22%,transparent)}
.alert{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;border:0;border-left:3px solid var(--warn);text-align:left;cursor:pointer;width:100%}
.alert.bad-a{background:var(--bad-bg);color:var(--bad);border-left-color:var(--bad)}
.alert .arr{margin-left:auto}

/* toolbar & controls */
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;position:relative}
.search svg{position:absolute;left:11px;top:50%;margin-top:-8px;color:var(--muted)}
.search input{padding-left:36px;background:var(--surface);height:42px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 12px;height:42px;font:400 14px var(--body);cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:transparent;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:0 15px;height:42px;font:700 14.5px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.ok{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn:disabled{opacity:.5;cursor:default}
.btn,.chip,.st,.rq,.seg button,.tabs button,.crew{transition:background .15s,border-color .15s,color .15s}
:is(button,a,input,select,textarea):focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.desk{display:inline-flex} @media (max-width:640px){.desk{display:none}}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:8;width:56px;height:56px;border-radius:16px;border:0;background:var(--primary);color:var(--primary-ink);font-size:28px;box-shadow:0 8px 24px rgba(20,40,80,.35);cursor:pointer;display:none}
@media (max-width:640px){.fab{display:grid;place-items:center}}
.link{border:0;background:none;color:var(--primary);font-weight:700;font-size:13.5px;cursor:pointer;padding:0;text-decoration:none}

/* request cards */
.rqs{display:flex;flex-direction:column;gap:8px}
.rq{position:relative;display:grid;grid-template-columns:1fr auto;gap:5px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);width:100%;overflow:hidden}
.rq::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--neutral))}
.rq:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}
.rq .l1{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.rq .t1{font:700 16px/1.3 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1}
.rq .t2{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;min-width:0;grid-column:1/-1}
.rq .t2 span{white-space:nowrap}
.rq .r1{justify-self:end;display:flex;align-items:center;gap:8px}
.tag{font:700 12px var(--mono);background:var(--tag);color:var(--tag-ink);padding:2px 7px 2px 14px;border-radius:3px 6px 6px 3px;position:relative;white-space:nowrap;letter-spacing:.03em}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--surface)}
.time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.k-n{--c:var(--info)} .k-a{--c:var(--neutral)} .k-s{--c:var(--warn)} .k-f{--c:var(--warn)} .k-o{--c:var(--violet)} .k-d{--c:var(--ok)} .k-g{--c:var(--ok)} .k-x{--c:var(--bad)}
.price{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font:700 17px var(--display)}
.due{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--warn)} .due.late{color:var(--bad)}
.urg{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.urg.h24{background:var(--bad-bg);color:var(--bad)}
.who{font-weight:700;color:var(--ink)} .who.none{color:var(--warn)}

/* forms & cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
input,select,textarea{font:15.5px var(--body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:72px;resize:vertical}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--ink);cursor:pointer;background:var(--surface2);font-weight:400}
.radio label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
.radio input{width:auto;accent-color:var(--primary)}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:14px!important;font-weight:400!important}
.chk input{width:auto;accent-color:var(--primary)}
.manual-f{display:none}
form:has(#n-man:checked) .manual-f{display:grid}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brass);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px}
.warn-note{font-size:12.5px;color:var(--warn);font-weight:700}
.err{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:700}

/* detail sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(580px,100%);height:100%;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding-block:4px 8px;z-index:1}
.sheet-h .ttl{flex-basis:100%;order:3;font:700 20px/1.3 var(--display)}
.x{margin-left:auto;border:0;background:var(--surface2);width:36px;height:36px;border-radius:9px;font-size:20px;cursor:pointer;line-height:1}
@media (max-width:640px){.sheet-bg{align-items:flex-end}.sheet{height:94%;border-radius:18px 18px 0 0;padding-top:8px}.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}.kv{grid-template-columns:100px 1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .2s ease-out}@keyframes in{from{transform:translateY(16px);opacity:.6}}}
.pricing{border-color:color-mix(in srgb,var(--brass) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 14%,transparent)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:13.5px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0 6px 14px;border-left:2px solid var(--line);position:relative}
.log li::before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--brass)}
.log time{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:12px}
.wa{font-family:var(--mono);font-size:13px;background:var(--surface2);border-radius:9px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bal{display:flex;gap:18px;flex-wrap:wrap;background:var(--surface2);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.bal b{display:block;font:700 16px var(--mono);color:var(--ink)} .bal .due-b b{color:var(--bad)} .bal .ok-b b{color:var(--ok)}
.pay{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}

/* quotes, items, photos */
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2)}
.q.chosen{border-color:var(--ok);background:var(--ok-bg)}
.q .qs{font-weight:700;min-width:0;overflow-wrap:anywhere}
.q .qc{font:700 15px var(--mono);text-align:right;white-space:nowrap}
.q .qm{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.q .qa{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.best{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:6px;padding:1px 6px}
.items{display:flex;flex-direction:column;gap:6px}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px}
.it:last-child{border-bottom:0;padding-bottom:0}
.it.off{opacity:.5;text-decoration:line-through}
.it .nm{min-width:0;overflow-wrap:anywhere}
.it input{width:120px;flex:none}
.irow{display:grid;grid-template-columns:1fr 80px;gap:8px}
.sum{display:flex;justify-content:space-between;font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface2);cursor:zoom-in;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb i{position:absolute;left:4px;bottom:4px;font:700 10px var(--body);font-style:normal;background:var(--scrim);color:#fff;border-radius:4px;padding:0 4px}
.upl{display:inline-flex;flex-direction:row;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:9px;padding:0 12px;height:42px;font-size:13.5px;font-weight:700;color:var(--primary);cursor:pointer;background:var(--surface)}
.upl input{display:none}
.lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}

/* customer */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--neutral-bg)}
.steps i.on{background:var(--ok)}
.steps-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);gap:4px}
.steps-l span.on{color:var(--ink);font-weight:700}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ccard .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ccard .top b{font:700 16px var(--display)}
.ccard .items{background:var(--surface2);border-radius:9px;padding:10px}
.offer{background:var(--violet-bg);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.offer .price{font-size:21px;color:var(--violet)}

/* people, workers, reports */
.ulist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.urow{display:grid;grid-template-columns:auto 1fr minmax(150px,200px);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .main{min-width:0}
@media (max-width:520px){.urow{grid-template-columns:auto 1fr}.urow select,.urow>.btn{grid-column:1/-1}}

details.dt{gap:0}
details.dt>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}

details.dt[open]>summary{margin-bottom:12px}
details.dt>:not(summary)+:not(summary){margin-top:12px}

/* ===== app look: hero + bottom navigation ===== */
:root{--hero1:#1c3557;--hero2:#0e1d36;--hero-ink:#ffffff;--hero-mute:rgba(255,255,255,.68);--hero-tile:rgba(255,255,255,.08);--hero-line:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero1:#1b2f50;--hero2:#0f1a2d;--hero-tile:rgba(255,255,255,.06)}}

.hero{position:relative;overflow:hidden;border-radius:16px;padding:14px;color:var(--hero-ink);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--brass) 28%,transparent) 0%,transparent 55%),linear-gradient(150deg,var(--hero1),var(--hero2));box-shadow:0 10px 28px rgba(14,29,54,.28);display:flex;flex-direction:column;gap:12px}
.hero::after{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--brass),transparent);opacity:.9}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hello{font:700 19px/1.2 var(--display)}
.hdate{font-size:12.5px;color:var(--hero-mute);margin-top:2px}
.hper{display:flex;gap:2px;background:var(--hero-tile);border:1px solid var(--hero-line);border-radius:9px;padding:2px}
.hper button{border:0;background:none;color:var(--hero-mute);font:700 11.5px var(--body);padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}

.hkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hk{border:1px solid var(--hero-line);background:var(--hero-tile);color:var(--hero-ink);border-radius:12px;padding:9px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;font:inherit}
.hk:hover{background:rgba(255,255,255,.12)}

.hk b{font:700 21px/1.1 var(--display);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk .hl{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bottom nav */

async function toJpeg(f){const img=await createImageBitmap(f);let side=1000,q=.72,out='';
  for(let i=0;i<5;i++){const s=Math.min(1,side/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<700000)break;side*=.75;q-=.08}
  return out}
async function uploadFiles(files,kind,rid,cidv){
  const out=[];if(!files||!files.length)return out;
  for(const f of [...files].slice(0,6)){try{const data=await toJpeg(f);const ref=doc(collection(db,'photos'));await setDoc(ref,{rid,cid:cidv||null,data,k:kind,t:Date.now(),by:actor()});S.ph[ref.id]=data;out.push({id:ref.id,k:kind,t:Date.now()})}
    catch(e){toast('Акс бор нашуд ('+errTxt(e)+'). JPG ё PNG интихоб кунед.')}}
  return out;
}

function rebuild(){

  for(const [id,w] of Object.entries(S.workers))u[id]={...w,role:w.active===false?'removed':'worker'};
  for(const [id,c] of Object.entries(S.customers))u[id]={...c,role:'customer'};
  S.users=u;
  const all={...S.extra,...(S.extraO||{}),...S.rawReqs};
  S.reqs=Object.entries(all).map(([id,d])=>{
    const p={...((S.privsO||{})[id]||{}),...(S.privs[id]||{})};const custOff=d.custOff||[];
    const items=itemsOf(d).map((it,i)=>({...it,off:!!it.off||custOff.includes(i)}));
    const priced=items.some(it=>it.price>0);

function itemRow(i){return`<div class="irow3"><input id="n-it-${i}" placeholder="${i?'Номи қисм':esc(C.itemPh)}" aria-label="Номи қисм ${i+1}"><input id="n-iq-${i}" type="number" min="1" value="1" aria-label="Миқдор"><input id="n-ic-${i}" class="codein" placeholder="Коди қисм (агар бошад)" autocapitalize="characters" spellcheck="false" aria-label="Коди қисм ${i+1}"></div>`}
function parseCodes(txt){const map=new Map(),notes=[];
  String(txt||'').split(/[\n;]+/).map(s=>s.trim()).filter(Boolean).slice(0,120).forEach(line=>{
    const tk=line.split(/[\s,]+/).filter(Boolean);const code=(tk[0]||'').toUpperCase().replace(/[.,:]+$/,'');
    if(!/\d/.test(code)||code.length<4){notes.push(line);return}
    let rest=tk.slice(1),q=1;const last=rest[rest.length-1];
    const m=last&&last.match(/^[x×*]?(\d{1,3})(шт|pcs|дона|ta)?\.?$/i);if(m){q=Math.max(1,+m[1]);rest=rest.slice(0,-1)}
    else if(rest.length>=2&&/^[x×*]$/i.test(rest[rest.length-2])&&/^\d{1,3}$/.test(last)){q=+last;rest=rest.slice(0,-2)}
    const n=rest.join(' ').replace(/^[-–:]+\s*/,'').trim();
    if(map.has(code)){const o=map.get(code);o.q+=q;if(!o.n&&n)o.n=n}else map.set(code,{code,n,q})});
  return{items:[...map.values()].slice(0,60),notes}}
function codesList(){const el=document.getElementById('n-codes'),box=document.getElementById('codes-list');if(!el||!box)return;
  const {items,notes}=parseCodes(el.value);S.cq=S.cq||{};
  box.innerHTML=items.length?`<div class="cl-h">Ёфт шуд: <b>${items.length}</b> код${notes.length?` · <span class="muted">${notes.length} сатр ҳамчун эзоҳ</span>`:''}</div>${items.map(it=>{const q=S.cq[it.code]||it.q;return`<div class="cl-r"><span class="cl-c"><code class="pc">${esc(it.code)}</code>${it.n?` <span class="small">${esc(it.n)}</span>`:''}</span><span class="stepper"><button type="button" data-cq="-1" data-code="${esc(it.code)}" aria-label="Кам">−</button><input class="cqin" data-code="${esc(it.code)}" type="number" min="1" value="${q}" aria-label="Миқдор"><button type="button" data-cq="1" data-code="${esc(it.code)}" aria-label="Зиёд">+</button></span></div>`}).join('')}`:'<div class="small muted">Кодҳо дар ин ҷо бо миқдорашон пайдо мешаванд.</div>'}

const qd={};
function queued(id,fn){qd[id]=(qd[id]||Promise.resolve()).then(fn,fn);return qd[id]}
async function upd(id,patch,txt,silent){
  if(patch&&patch.status&&view()==='worker')S.lastMoved={id,st:patch.status,t:Date.now()};
  const r=S.reqs.find(x=>x.id===id);if(!r)return false;
  const pub={},priv={};for(const k in patch)(PRIV_KEYS.includes(k)?priv:pub)[k]=patch[k];
  const entry={t:Date.now(),by:actor(),s:txt};
  const hasPriv=Object.keys(priv).length>0;
  try{
    await queued(id,async()=>{
      if(Object.keys(pub).length||!hasPriv){pub.updatedAt=Date.now();if(!hasPriv)pub.log=(r.log||[]).concat([entry]).slice(-50);await updateDoc(doc(db,'requests',id),pub)}
      if(hasPriv){priv.workerId=('workerId' in pub?pub.workerId:r.workerId)||null;priv.log=(r.plog||[]).concat([entry]).slice(-50);await setDoc(doc(db,'priv',id),priv,{merge:true})}
    });
    if(!silent)toast(txt);return true;
  }catch(e){toast('Сабт нашуд: '+errTxt(e));return false}
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const fnum=id=>{const v=parseFloat(val(id));return isFinite(v)?v:null};
function calcPP(id){
  const r=S.reqs.find(x=>x.id===id);const pt=document.getElementById('pt-'+id),pp=document.getElementById('pp-'+id);if(!r||!pt)return;
  let sum=0,any=false;document.querySelectorAll('[data-pp="'+id+'"]').forEach(el=>{const v=parseFloat(el.value);if(isFinite(v)){sum+=v;any=true}});
  pt.textContent=any?money(sum):'—';
  if(pp){if(any&&r.cost){const p=sum-r.cost;pp.textContent=money(Math.round(p*100)/100)+(sum?' · '+Math.round(p/sum*100)+'%':'');pp.style.color=p<0?'var(--bad)':''}else pp.textContent='—'}
}

    case'logodel':try{await setDoc(doc(db,'settings','app'),{logo:''},{merge:true});toast('Логотип нест шуд')}catch(err){toast('Нашуд: '+errTxt(err))}return;
    case'assignord':{const w=b.dataset.v,u=S.users[w];if(!u||r.orderWorkerId===w)return;
      if(await upd(id,{orderWorkerId:w,ordStage:r.ordStage||'assigned'},'Масъули заказ: '+u.name))setDoc(doc(db,'priv',id),{orderWorkerId:w},{merge:true}).catch(()=>{});return}
    case'ostage':{const s=b.dataset.v;await upd(id,{ordStage:s},'Заказ: '+OST[s]);return}
    case'ocargo':{const cg=val('o-cargo-'+id),tk=val('o-trk-'+id);if(!(r.photos||[]).some(p=>p.k==='g')){toast('Аввал акси борро дар карго гузоред');return}if(!cg){toast('Номи каргоро нависед');return}
      const kg=fnum('o-kg-'+id),dd=val('o-dd-'+id);if(!(kg>0)){toast('Вазни борро (кг) нависед');return}if(!dd){toast('Рӯзи супоридан ба муштариро интихоб кунед');return}
      await upd(id,{status:'shipped',ordStage:'shipped',cargo:cg,tracking:tk,weight:kg,deliverBy:new Date(dd+'T12:00').getTime(),shippedAt:Date.now()},'Ба карго дода шуд: '+cg+(tk?' · '+tk:'')+' · '+kg+' кг · то '+dd);return}
    case'admno':S.confirmAdm=null;break;
    case'admdel':{const em=b.dataset.v;if(S.confirmAdm!==em){S.confirmAdm=em;break}try{await deleteDoc(doc(db,'admins',em));S.confirmAdm=null;toast('Хориҷ шуд: '+em)}catch(err){toast('Нашуд: '+errTxt(err))}return}
    case'delno':S.confirmDel=null;break;
    case'delreq':{if(S.confirmDel!==id){S.confirmDel=id;break}
      try{await deleteDoc(doc(db,'requests',id));await deleteDoc(doc(db,'priv',id)).catch(()=>{});for(const p of (r.photos||[]))deleteDoc(doc(db,'photos',p.id)).catch(()=>{});S.open=null;S.confirmDel=null;toast('Дархост №'+r.code+' нест карда шуд')}catch(err){toast('Нест нашуд: '+errTxt(err))}return}
    case'adm-accept':if(r)await upd(id,{status:'ordered',orderedAt:Date.now()},'Роҳбар аз номи муштарӣ тасдиқ кард: заказ');return;
    case'adm-decline':if(r)await upd(id,{status:'cancelled'},'Роҳбар қайд кард: муштарӣ рад кард');return;
    case'cust-accept':await upd(id,{status:'ordered',orderedAt:Date.now()},'Муштарӣ заказ дод');return;
    case'cust-decline':await upd(id,{status:'cancelled'},'Муштарӣ рад кард');return;
    case'cust-cancel':await upd(id,{status:'cancelled'},'Муштарӣ бекор кард');return;
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.lb)S.lb=null;else if(S.open)S.open=null;else return;render()}});
setInterval(()=>{const ae=document.activeElement;if(!ae||ae===document.body)render()},60000);

/* ===== activity: who entered / left and when ===== */
const ROLE_L={admin:'Роҳбар',worker:'Коргар',customer:'Муштарӣ'};
const ACT_L={login:'Ворид шуд',open:'Кушод',close:'Пӯшид',logout:'Баромад'};
function meInfo(){if(S.isAdmin)return{id:'adm:'+(S.email||'admin'),role:'admin',name:(S.admins&&S.admins[S.email]&&S.admins[S.email].name)||(S.isOwner?'Соҳиб':S.email||'Роҳбар')};
  if(S.wid)return{id:S.wid,role:'worker',name:uname(S.wid)};if(S.cid)return{id:S.cid,role:'customer',name:uname(S.cid)};return null}
let lastOpen=0,hiddenAt=0,beat=null;
function logAct(type){const m=meInfo();if(!m)return Promise.resolve();
  const dev=/Android/i.test(navigator.userAgent)?'Android':/iPhone|iPad/i.test(navigator.userAgent)?'iPhone':'Компютер';
  const p1=setDoc(doc(collection(db,'activity')),{who:m.id,role:m.role,name:m.name||'',type,t:Date.now(),dev}).catch(()=>{});
  const p2=setDoc(doc(db,'presence',m.id.replace(/[\/]/g,'_')),{who:m.id,role:m.role,name:m.name||'',lastSeen:Date.now(),online:type!=='close'&&type!=='logout'},{merge:true}).catch(()=>{});
  return Promise.all([p1,p2])}
function startPresence(type){lastOpen=Date.now();setTimeout(()=>logAct(type||'open'),1500);clearInterval(beat);
  beat=setInterval(()=>{if(document.visibilityState==='visible'){const m=meInfo();if(m)setDoc(doc(db,'presence',m.id.replace(/[\/]/g,'_')),{lastSeen:Date.now(),online:true},{merge:true}).catch(()=>{})}},60000)}
document.addEventListener('visibilitychange',()=>{if(!meInfo())return;
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();logAct('close')}
  else if(hiddenAt&&Date.now()-hiddenAt>60000){logAct('open')}else if(hiddenAt){const m=meInfo();setDoc(doc(db,'presence',m.id.replace(/[\/]/g,'_')),{lastSeen:Date.now(),online:true},{merge:true}).catch(()=>{})}});

/* ===== data subscriptions ===== */
function stopAll(){S.subErr=null;sub.warned=false;unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];S.rawReqs={};S.extra={};S.extraO={};S.privsO={};S.privs={};S.workers={};S.customers={}}
function sub(q,fn,label){unsubs.push(onSnapshot(q,fn,err=>{console.warn(label,err);S.subErr=(err&&err.code)||'error';if(fn.fail)fn.fail();if(!sub.warned){sub.warned=true;toast('Қисме аз маълумот бор нашуд ('+errTxt(err)+'). Қоидаҳои Firebase-ро санҷед.')}}))}
function waitAll(n){let left=n;S.ready=false;const t=setTimeout(()=>{S.slow=true;render()},10000);return()=>{if(--left<=0){clearTimeout(t);S.ready=true;S.slow=false}rebuild();render()}}
function startAdmin(){
  stopAll();const done=waitAll(5);
  const firstOnce=f=>{let first=true;const h=s=>{f(s);if(first){first=false;done()}else{rebuild();render()}};h.fail=()=>{if(first){first=false;done()}};return h};
  sub(query(collection(db,'requests'),orderBy('createdAt','desc'),limit(1500)),firstOnce(s=>{S.rawReqs={};s.forEach(d=>S.rawReqs[d.id]=d.data())}),'requests');
  sub(collection(db,'priv'),firstOnce(s=>{S.privs={};s.forEach(d=>S.privs[d.id]=d.data())}),'priv');
  sub(collection(db,'workers'),firstOnce(s=>{S.workers={};s.forEach(d=>S.workers[d.id]=d.data())}),'workers');
  sub(collection(db,'customers'),firstOnce(s=>{S.customers={};s.forEach(d=>S.customers[d.id]=d.data())}),'customers');
  sub(collection(db,'admins'),firstOnce(s=>{S.admins={};s.forEach(d=>S.admins[d.id]=d.data())}),'admins');
  unsubs.push(onSnapshot(query(collection(db,'activity'),orderBy('t','desc'),limit(600)),s=>{S.acts=[];s.forEach(d=>S.acts.push(d.data()));if(S.repTab==='a'||S.adminTab==='users')render()},()=>{}));
  unsubs.push(onSnapshot(collection(db,'presence'),s=>{S.pres={};s.forEach(d=>{const x=d.data();S.pres[x.who||d.id]=x});if(S.repTab==='a'||S.adminTab==='users')render()},()=>{}));
}
function startWorker(wid){
  stopAll();S.wid=wid;const done=waitAll(6);
  const firstOnce=f=>{let first=true;const h=s=>{f(s);if(first){first=false;done()}else{rebuild();render()}};h.fail=()=>{if(first){first=false;done()}};return h};
  sub(query(collection(db,'requests'),where('workerId','==',wid)),firstOnce(s=>{S.rawReqs={};s.forEach(d=>S.rawReqs[d.id]=d.data())}),'my requests');
  sub(query(collection(db,'requests'),where('status','==','assigned'),where('workerId','==',null)),firstOnce(s=>{S.extra={};s.forEach(d=>S.extra[d.id]=d.data())}),'open requests');
  sub(query(collection(db,'priv'),where('workerId','==',wid)),firstOnce(s=>{S.privs={};s.forEach(d=>S.privs[d.id]=d.data())}),'priv');
  sub(collection(db,'workers'),firstOnce(s=>{S.workers={};s.forEach(d=>S.workers[d.id]=d.data())}),'workers');
  sub(query(collection(db,'requests'),where('orderWorkerId','==',wid)),firstOnce(s=>{S.extraO={};s.forEach(d=>S.extraO[d.id]=d.data())}),'my orders');
  sub(query(collection(db,'priv'),where('orderWorkerId','==',wid)),firstOnce(s=>{S.privsO={};s.forEach(d=>S.privsO[d.id]=d.data())}),'order priv');
}
async function startCustomer(cidv){
  stopAll();S.cid=cidv;const done=waitAll(2);
  const firstOnce=f=>{let first=true;const h=s=>{f(s);if(first){first=false;done()}else{rebuild();render()}};h.fail=()=>{if(first){first=false;done()}};return h};
  sub(query(collection(db,'requests'),where('customerId','==',cidv)),firstOnce(s=>{S.rawReqs={};s.forEach(d=>S.rawReqs[d.id]=d.data())}),'my requests');
  sub(doc(db,'customers',cidv),firstOnce(s=>{S.customers={};if(s.exists())S.customers[cidv]=s.data()}),'me');
}

/* ===== auth ===== */
render();
onSnapshot(doc(db,'settings','app'),s=>{applyCfg(s.exists()?s.data():null);render()},()=>{});

onAuthStateChanged(auth,async user=>{
  S.isAdmin=false;S.isOwner=false;S.wid=null;S.cid=null;S.denied=null;S.verify=null;S.view=null;
  if(!user){stopAll();S.authReady=true;S.ready=true;rebuild();render();return}
  S.authReady=true;S.ready=false;render();
  try{
    const email=(user.email||'').toLowerCase();
    S.email=email;S.justLogged=S.justLogged||false;
    if(!user.isAnonymous&&ADMIN_EMAILS.includes(email)){S.isAdmin=true;S.isOwner=true;startAdmin();startPresence(S.justLogged?'login':'open');S.justLogged=false;return}
    if(!user.isAnonymous&&user.emailVerified&&!email.endsWith('@'+WORKER_DOMAIN)){const ad=await getDoc(doc(db,'admins',email)).catch(()=>null);if(ad&&ad.exists()){S.isAdmin=true;startAdmin();startPresence(S.justLogged?'login':'open');S.justLogged=false;return}}
    if(!user.isAnonymous&&!user.emailVerified&&!email.endsWith('@'+WORKER_DOMAIN)){const ad0=await getDoc(doc(db,'admins',email)).catch(()=>null);if(ad0&&ad0.exists()){S.verify=email;S.ready=true;render();return}}
    if(email.endsWith('@'+WORKER_DOMAIN)){
      const st=await getDoc(doc(db,'staff',user.uid));
      if(!st.exists()){S.denied='Ин логин дигар фаъол нест. Аз роҳбар логини нав гиред.';S.ready=true;render();return}
      startWorker(st.data().wid);startPresence(S.justLogged?'login':'open');S.justLogged=false;return}
    if(user.isAnonymous){
      const ss=await getDoc(doc(db,'sessions',user.uid));
      if(ss.exists()&&ss.data().cid){await startCustomer(ss.data().cid);if(!S.custLogged)startPresence('open');return}
      S.ready=true;render();return}
    S.denied='Почтаи '+email+' роҳбар нест. Агар муштарӣ бошед, бароед ва бо рақами WhatsApp ворид шавед.';S.ready=true;render();
  }catch(err){S.denied='Маълумот бор нашуд ('+errTxt(err)+').';S.ready=true;render()}
});
</script>
